<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ランド　パークマップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2c2416;
    --paper:#fffaf0;
    --paper-warm:#fbf0d8;
    --gold:#e8b23d;
    --raspberry:#d1495b;
    --muted:#6f6247;        /* 本文に対する副次テキスト（コントラスト確保済み） */
    --line: rgba(44,36,22,0.13);
    --edge: rgba(44,36,22,0.20);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg,#fdf4dd 0%, #f7e9c4 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding:28px 16px 80px;
    -webkit-text-size-adjust:100%;
    overflow-x:hidden;
  }

  .wrap{max-width:780px;margin:0 auto;}

  /* ---------- header ---------- */
  .site-header{text-align:center;margin-bottom:18px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.18em;
    font-size:11px;
    color:var(--raspberry);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .gate-logo{
    width:100%;
    max-width:400px;
    margin:0 auto 10px;
  }
  .gate-logo svg{width:100%;height:auto;display:block;overflow:visible;}
  h1{
    /* .gate-logo が視覚表現。スクリーンリーダー用に保持 */
    position:absolute;
    width:1px;height:1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    clip-path:inset(50%);
    white-space:nowrap;
  }
  .sub{font-size:13px;color:var(--muted);line-height:1.6;}

  /* ---------- park map ---------- */
  .park-stage{
    position:relative;
    width:100%;
    max-width:740px;
    margin:0 auto;
    border-radius:20px;
    overflow:hidden;
    border:3px solid var(--ink);
    box-shadow: 0 6px 0 rgba(44,36,22,.15);
    background:#bcd98a;
  }
  .park-stage svg{width:100%;height:auto;display:block;}

  /* ---------- stats ---------- */
  .stat-row{
    display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
    margin:16px 0 0;
  }
  .stat-chip{
    display:inline-flex;align-items:baseline;gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    background:var(--paper);
    border:1px solid var(--edge);
    color:var(--muted);
    padding:6px 13px;
    border-radius:999px;
  }
  .stat-chip b{color:var(--raspberry);font-weight:700;font-size:13px;}

  .progress-outer{
    width:100%;max-width:420px;margin:16px auto 0;height:12px;
    background:var(--paper);
    border-radius:999px;overflow:hidden;
    border:1px solid var(--edge);
  }
  .progress-inner{
    height:100%;
    background:linear-gradient(90deg, var(--raspberry), var(--gold), #4a7ba6);
    background-size:420px 100%;
    width:0%;
    transition:width .5s cubic-bezier(.4,1.4,.4,1);
    border-radius:999px;
  }

  .banner{
    text-align:center;
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:13px;line-height:1.7;
    color:var(--ink);
    background:rgba(209,73,91,0.08);
    border:1px dashed rgba(232,178,61,0.85);
    border-radius:12px;
    padding:11px 16px;
    margin:18px auto 0;
    max-width:560px;
    text-wrap:balance;
  }

  /* ---------- accordion list ---------- */
  .strata{margin-top:24px;display:flex;flex-direction:column;gap:10px;}

  .layer{
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--edge);
    background:var(--paper);
    box-shadow:0 1px 0 rgba(44,36,22,.05);
  }

  .layer-head{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:14px 16px;cursor:pointer;user-select:none;
    background:none;border:0;margin:0;text-align:left;
    font:inherit;color:inherit;
  }
  .layer-head:hover{background:rgba(232,178,61,.08);}
  .land-icon{
    width:34px;height:34px;flex-shrink:0;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ink);
  }
  .land-icon svg{width:20px;height:20px;}
  .layer-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;color:var(--muted);letter-spacing:.02em;
  }
  .layer-titles{flex:1;min-width:0;display:block;}
  .layer-titles > span{display:block;}
  .layer-title{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;font-size:15px;color:var(--ink);line-height:1.4;
  }
  .layer-subtitle{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .layer-count{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;color:var(--raspberry);flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .layer.done .layer-count{color:#4a7a3a;}
  .layer-chevron{flex-shrink:0;width:16px;height:16px;transition:transform .25s;color:var(--muted);}
  .layer.open .layer-chevron{transform:rotate(90deg);}

  .layer-mini-progress{height:4px;background:rgba(44,36,22,.10);}
  .layer-mini-progress-fill{height:100%;width:0;transition:width .4s ease;}

  .layer-body{
    max-height:0;overflow:hidden;
    transition:max-height .35s ease;
    background:var(--paper-warm);
  }

  .item{
    display:flex;align-items:flex-start;gap:11px;width:100%;
    padding:11px 16px;border-top:1px solid var(--line);
    cursor:pointer;user-select:none;
    background:none;border-left:0;border-right:0;border-bottom:0;
    font:inherit;color:inherit;text-align:left;
  }
  .item:hover{background:#f5e6bf;}

  .stamp{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;
    border:2px solid var(--ink);margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    transition:background-color .2s, transform .2s;background:transparent;
  }
  .item.done .stamp{background:var(--gold);transform:scale(1.06);}
  .stamp svg{width:12px;height:12px;opacity:0;transition:opacity .15s;stroke:var(--ink);}
  .item.done .stamp svg{opacity:1;}

  .item-text{font-size:13.5px;line-height:1.6;color:var(--ink);}
  .item.done .item-text{color:#8b7d5f;text-decoration:line-through;text-decoration-color:rgba(44,36,22,.35);}
  .priority-badge{
    display:inline-block;font-family:'JetBrains Mono', monospace;font-size:9.5px;
    background:var(--raspberry);color:#fff;padding:2px 6px;border-radius:4px;
    margin-right:7px;font-weight:700;line-height:1.3;
    position:relative;top:-1px;
  }
  .item.done .priority-badge{background:#b09a72;}

  footer{text-align:center;margin-top:28px;}
  .reset-btn{
    font-family:'JetBrains Mono', monospace;font-size:11px;color:var(--muted);
    background:none;border:1px solid rgba(44,36,22,.25);border-radius:999px;
    padding:7px 15px;cursor:pointer;transition:color .15s,border-color .15s;
  }
  .reset-btn:hover{color:var(--ink);border-color:var(--ink);}

  /* キーボード操作時のフォーカス表示 */
  .layer-head:focus-visible,
  .item:focus-visible,
  .reset-btn:focus-visible{
    outline:2px solid var(--raspberry);
    outline-offset:-3px;
    border-radius:6px;
  }

  /* ライブラリが使えないときの紙吹雪（CSSのみ） */
  .confetti-piece{
    position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;
    pointer-events:none;z-index:999;animation: fall linear forwards;
  }
  @keyframes fall{ to{ transform: translateY(110vh) rotate(540deg); opacity:0.2; } }

  /* fireworks-js の描画先。全画面に重ねるが操作は邪魔しない */
  .fx-fireworks{
    position:fixed;inset:0;pointer-events:none;z-index:998;
  }

  @media (max-width:560px){
    body{padding:20px 12px 60px;}
    .park-stage{border-width:2px;border-radius:16px;}
    .layer-head{padding:12px 13px;gap:10px;}
    .land-icon{width:30px;height:30px;}
    .land-icon svg{width:18px;height:18px;}
    .layer-title{font-size:14px;}
    .item{padding:11px 13px;}
    .item-text{font-size:13px;}
    .stat-row{gap:7px;}
    .stat-chip{padding:5px 11px;font-size:11px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="site-header">
    <div class="eyebrow">DISSERTATION LAND · PARK MAP</div>
    <h1>ランド　パークマップ</h1>

        <use href="#archBand" fill="none" stroke="#e8b23d" stroke-width="28" stroke-linecap="round"/>

        <g fill="#fff3c9" stroke="#2c2416" stroke-width="1.2">

          <circle cx="169.4" cy="31.3" r="4.2"/><circle cx="209.6" cy="24.8" r="4.2"/>
          <circle cx="250.4" cy="24.8" r="4.2"/><circle cx="290.6" cy="31.3" r="4.2"/>
          <circle cx="329.2" cy="44.2" r="4.2"/><circle cx="365.3" cy="63.0" r="4.2"/>

        </g>

        <!-- pennant on top -->
        <line x1="230" y1="26" x2="230" y2="6" stroke="#2c2416" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="230,6 249,12.5 230,19" fill="#d1495b" stroke="#2c2416" stroke-width="1.4" stroke-linejoin="round"/>

        <!-- wordmark following the arch -->
        <text font-family="'Zen Maru Gothic', sans-serif" font-weight="900" font-size="30" fill="#fffaf0" stroke="#2c2416" stroke-width="1.8" paint-order="stroke" letter-spacing="2">
          <textPath href="#archText" startOffset="50%" text-anchor="middle">ランド</textPath>
        </text>

        <!-- sub banner -->
        <rect x="145" y="156" width="170" height="28" rx="14" fill="#fffaf0" stroke="#2c2416" stroke-width="2"/>
        <text x="230" y="175" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#2c2416" letter-spacing="1.5">PARK MAP</text>
      </svg>
    </div>
    <div class="sub">各エリアを完成させて、パーク全体をグランドオープンへ</div>
  </div>

  <div class="park-stage" id="parkStage"></div>

  <div class="stat-row">
    <div class="stat-chip"><span>開園準備</span><b id="statPercent">0%</b></div>
    <div class="stat-chip"><span>来園者数</span><b id="statPop">0人</b></div>
    <div class="stat-chip"><span>完成エリア</span><b id="statCount">0 / 7</b></div>
  </div>

  <div class="progress-outer" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressOuter">
    <div class="progress-inner" id="progressInner"></div>
  </div>

  <div class="banner" id="banner" aria-live="polite"></div>

  <div class="strata" id="strata"></div>

  <footer>
    <button class="reset-btn" id="resetBtn">パークをリセット</button>
  </footer>
</div>

  sec.norm = sec.items.map((it,i)=>{
    const obj = (typeof it === 'string') ? {t:it,p:false} : it;
    const id = sec.id+'-'+i;
    flat.push(id);
    return {id, text:obj.t, priority:!!obj.p};
  });
});

const STORE_KEY = 'themepark-map-checklist-state';
let state = {};

/* window.storage（ホスト提供）を優先し、無ければ localStorage にフォールバック */
async function loadState(){
  try{
    if(window.storage && window.storage.get){
      const res = await window.storage.get(STORE_KEY, false);
      if(res && res.value){ state = JSON.parse(res.value); return; }
    }
  }catch(e){ /* fall through */ }
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) state = JSON.parse(raw);
  }catch(e){ state = {}; }
}
async function saveState(){
  const json = JSON.stringify(state);
  try{ localStorage.setItem(STORE_KEY, json); }catch(e){ /* best effort */ }
  try{
    if(window.storage && window.storage.set){ await window.storage.set(STORE_KEY, json, false); }
  }catch(e){ /* best effort */ }
}

function countDone(){ return flat.filter(id=>state[id]).length; }

/* 実際の建設状況から文面を組み立てる。
   全体の進捗率だけで判断すると、おとぎ城の工事段階と食い違う文面になるため、
   「開園したエリア数」と「おとぎ城自身の進捗」をそれぞれ見て書き分ける。
   おとぎ城の分岐は castleLand() の描画段階と同じ閾値に合わせてある。 */
function bannerText(ctx){
  const {done, started, completed, sections, castleP} = ctx;

  if(done === 0) return 'まだ更地です。地面に区画の線を引いたところ。さあ、どのエリアから始めましょう。';
  if(completed === sections) return 'ランド、全エリア完成。ゲートを開けて、花火を打ち上げましょう。おつかれさまでした。';

  const head = completed === 0
    ? (started === 1
        ? '最初の区画にクレーンが立ちました。'
        : started + 'つの区画で工事が進んでいます。')
    : '旗が上がったエリアが' + completed + 'つ。残りは' + (sections - completed) + 'エリアです。';

  const castle =
    castleP >= 1    ? 'おとぎ城はもう明かりを灯して、開園の日を待っています。' :
    castleP >= 0.85 ? 'おとぎ城の窓に明かりが灯りました。あとは旗を上げるだけです。' :
    castleP >= 0.7  ? 'おとぎ城に屋根がかかりました。' :
    castleP >= 0.5  ? 'おとぎ城の中央の塔が、高く伸びてきました。' :
    castleP >= 0.3  ? 'おとぎ城の左右の塔が立ち上がりました。' :
    castleP >= 0.15 ? 'おとぎ城の広間の壁が積み上がってきました。' :
    castleP > 0     ? 'おとぎ城も基礎の工事に入りました。' :
                      'パークの真ん中、おとぎ城の区画はまだ手つかずです。';

  return head + castle;
}

/* 各エリアのランドマーク建築。原点は建物の足元（地面の中心）。
   完成形を最初から見せず、チェックが進むほど部材が増えて形が現れる。
   t(閾値, 部材) … 進捗率がその閾値に達したら描画される。
   0.001=基礎 → 0.2=躯体 → 0.4=屋根/頭部 → 0.6=付属 → 0.7=開口部/表情 → 1=装飾 */
function lighten(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const mix = v => Math.round(v + (255-v)*amt);
  return '#'+[mix((n>>16)&255), mix((n>>8)&255), mix(n&255)]
    .map(v=>v.toString(16).padStart(2,'0')).join('');
}

  const n = sec.norm.length;
  const done = sec.norm.filter(it=>state[it.id]).length;

  const flagUp = p >= 1;

  return `
    <g>

  /* パークの主役なので、他エリアより刻みを細かく（7段階）して積み上がっていく */
  return `
  <g transform="translate(${cx-55},${cy-95}) scale(1.05)">
    <ellipse cx="55" cy="128" rx="90" ry="20" fill="${sec.color}" opacity="${(0.15+p*0.5).toFixed(3)}"/>
    ${p<=0 ? `<g transform="translate(55,126)">${PLAN_SIGN}</g>` : ''}
    ${t(0.001,`<rect x="8" y="118" width="94" height="8" rx="2" fill="#c9a86a" ${S}/>`)}
    ${t(0.15,`<rect x="15" y="82" width="80" height="44" fill="${wall}" ${S}/>`)}
    ${t(0.3,`<rect x="-14" y="66" width="24" height="60" fill="${wall}" ${S}/>
      <rect x="100" y="66" width="24" height="60" fill="${wall}" ${S}/>`)}
    ${t(0.5,`<rect x="40" y="30" width="30" height="56" fill="${wall}" ${S}/>`)}
    ${t(0.7,`<polygon points="-14,66 -2,46 10,66" fill="#d1495b" ${S}/>
      <polygon points="100,66 112,46 124,66" fill="#4a7ba6" ${S}/>
      <polygon points="40,30 55,4 70,30" fill="#e8b23d" ${S}/>`)}
    ${t(0.85,`<rect x="47" y="50" width="16" height="16" rx="8" fill="${lit}" stroke="#2c2416" stroke-width="1.4"/>
      <rect x="0" y="88" width="9" height="10" fill="${lit}" stroke="#2c2416" stroke-width="1.2"/>
      <rect x="106" y="88" width="9" height="10" fill="${lit}" stroke="#2c2416" stroke-width="1.2"/>
      <path d="M45 126 v-16 a10 10 0 0 1 20 0 v16 z" fill="#2c2416" opacity=".8"/>`)}
    ${t(1,`<line x1="55" y1="4" x2="55" y2="-12" stroke="#2c2416" stroke-width="1.8"/>
      <polygon points="55,-12 69,-7 55,-2" fill="#d1495b" stroke="#2c2416" stroke-width="1.2"/>
      <g fill="#ffd964" stroke="#2c2416" stroke-width="1" paint-order="stroke">
        <text x="-62" y="14" font-size="22">✦</text><text x="138" y="4" font-size="18">✦</text>
        <text x="156" y="36" font-size="15">✦</text></g>`)}
    ${p>0 && p<1 ? `<g fill="none" stroke="#2c2416" stroke-width="2" opacity=".5">
      <line x1="-34" y1="126" x2="-34" y2="50"/><line x1="-44" y1="56" x2="-16" y2="56"/>
      <line x1="-34" y1="50" x2="-19" y2="56"/><line x1="-34" y1="50" x2="-41" y2="56"/>
      <line x1="-20" y1="56" x2="-20" y2="70"/></g>
      <rect x="-25" y="70" width="10" height="7" fill="#ded8c6" stroke="#2c2416" stroke-width="1.4" opacity=".65"/>`:''}
    <text x="55" y="152" text-anchor="middle" font-family="'Zen Maru Gothic', sans-serif"
          font-weight="700" font-size="14" fill="#2c2416"
          stroke="#eef6dd" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round">${sec.land}</text>
  </g>`;
}

/* 中央のおとぎ城を囲む配置。ラベルが viewBox 内に収まり、
   かつ城と重ならないように余白を取ってある */
const POSITIONS = {
  G:[320, 52, 76, 30],
  D:[108, 96, 70, 40],
  F:[532, 96, 70, 40],
  A:[108, 258, 70, 40],
  C:[532, 258, 70, 40],
  B:[320, 336, 78, 32],
};
const CASTLE = [320, 218];

function parkSVG(){
  let lands = '';
  SECTIONS.forEach(sec=>{
    if(sec.id==='E') return;
    const [cx,cy,rx,ry] = POSITIONS[sec.id];
    lands += landSVG(sec, cx, cy, rx, ry);
  });
  const eSec = SECTIONS.find(s=>s.id==='E');

  const roads = Object.keys(POSITIONS)
    .map(k=>`<path d="M${CASTLE[0]},${CASTLE[1]} L${POSITIONS[k][0]},${POSITIONS[k][1]}"/>`)
    .join('');

  return `
  <svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="パークマップ">
    <defs>
      <radialGradient id="parkBg" cx="50%" cy="48%" r="72%">
        <stop offset="0%" stop-color="#dcefb6"/>
        <stop offset="100%" stop-color="#bcd98a"/>
      </radialGradient>
    </defs>
    <rect width="640" height="400" fill="url(#parkBg)"/>

    <!-- 中央ハブから各エリアへの園路 -->
    <g stroke="#f3e9c9" stroke-width="14" fill="none" stroke-linecap="round" opacity=".9">${roads}</g>
    <g stroke="#2c2416" stroke-width="1" fill="none" opacity=".15" stroke-dasharray="3 7">${roads}</g>

    ${lands}
    ${castleLand(eSec, CASTLE[0], CASTLE[1])}
  </svg>`;
}

/* ============ DOM ============ */
const els = {
  statPercent: document.getElementById('statPercent'),
  statPop: document.getElementById('statPop'),
  statCount: document.getElementById('statCount'),
  progressOuter: document.getElementById('progressOuter'),
  progressInner: document.getElementById('progressInner'),
  banner: document.getElementById('banner'),
  parkStage: document.getElementById('parkStage'),
  strata: document.getElementById('strata'),
};

let prevPct = -1;
let prevCompleted = -1;
const layerRefs = {};   // sec.id -> {layer, body, count, fill, rows:{id:el}}

/* リストは一度だけ組み立て、以降は差分更新する
   （毎回作り直すとアコーディオンのアニメーションが効かず、画面もちらつくため） */
function buildStrata(){
  els.strata.innerHTML = '';
  SECTIONS.forEach((sec, idx)=>{
    const layer = document.createElement('div');
    layer.className = 'layer';

    const bodyId = 'body-'+sec.id;
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'layer-head';
    head.setAttribute('aria-expanded','false');
    head.setAttribute('aria-controls', bodyId);
    head.innerHTML = `
      <span class="land-icon" style="background:${sec.color}33">${ICONS[sec.icon]}</span>
      <span class="layer-titles">
        <span class="layer-tag">${sec.tag}　${sec.land}</span>
        <span class="layer-title">${sec.title}</span>
        <span class="layer-subtitle">${sec.subtitle}</span>
      </span>
      <span class="layer-count">0/${sec.norm.length}</span>
      <svg class="layer-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    `;

    const miniProg = document.createElement('div');
    miniProg.className = 'layer-mini-progress';
    miniProg.innerHTML = `<div class="layer-mini-progress-fill" style="background:${sec.color}"></div>`;

    const body = document.createElement('div');
    body.className = 'layer-body';
    body.id = bodyId;

    const rows = {};
    sec.norm.forEach(it=>{
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'item';
      row.setAttribute('role','checkbox');
      row.setAttribute('aria-checked','false');
      row.innerHTML = `
        <span class="stamp" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        <span class="item-text">${it.priority?'<span class="priority-badge">★最優先</span>':''}${it.text}</span>
      `;
      row.addEventListener('click', ()=>toggleItem(sec, it.id));
      rows[it.id] = row;
      body.appendChild(row);
    });

    head.addEventListener('click', ()=>setOpen(sec.id, !layer.classList.contains('open')));

    layer.appendChild(head);
    layer.appendChild(miniProg);
    layer.appendChild(body);
    els.strata.appendChild(layer);

    layerRefs[sec.id] = {
      layer, head, body, rows,
      count: head.querySelector('.layer-count'),
      fill: miniProg.querySelector('.layer-mini-progress-fill'),
    };
  });
}

function setOpen(secId, open){
  const ref = layerRefs[secId];
  ref.layer.classList.toggle('open', open);
  ref.head.setAttribute('aria-expanded', String(open));
  ref.body.style.maxHeight = open ? ref.body.scrollHeight + 'px' : '0px';
}

function refreshOpenHeights(){
  Object.values(layerRefs).forEach(ref=>{
    if(ref.layer.classList.contains('open')) ref.body.style.maxHeight = ref.body.scrollHeight + 'px';
  });
}
window.addEventListener('resize', refreshOpenHeights);

function toggleItem(sec, id){
  const wasComplete = sec.norm.every(it=>state[it.id]);
  state[id] = !state[id];
  saveState();
  updateSection(sec);

  const justCompleted = !wasComplete && sec.norm.every(it=>state[it.id]);
  const allComplete = SECTIONS.every(s=>s.norm.every(it=>state[it.id]));

  /* 全エリア完成なら花火にまとめるので、単独の紙吹雪は出さない */
  updateGlobals(true);
  if(justCompleted && !allComplete) celebrateArea(sec);
}

function updateSection(sec){
  const ref = layerRefs[sec.id];
  const done = sec.norm.filter(it=>state[it.id]).length;
  sec.norm.forEach(it=>{
    const row = ref.rows[it.id];
    const on = !!state[it.id];
    row.classList.toggle('done', on);
    row.setAttribute('aria-checked', String(on));
  });
  ref.count.textContent = done+'/'+sec.norm.length;
  ref.fill.style.width = Math.round(done/sec.norm.length*100)+'%';
  ref.layer.classList.toggle('done', done===sec.norm.length);
}

function updateGlobals(animateConfetti){
  const done = countDone();
  const pct = TOTAL ? Math.round(done/TOTAL*100) : 0;
  const completedLands = SECTIONS.filter(sec=>sec.norm.every(it=>state[it.id])).length;
  const startedLands = SECTIONS.filter(sec=>sec.norm.some(it=>state[it.id])).length;
  const castle = SECTIONS.find(sec=>sec.id==='E');
  const castleP = castle.norm.filter(it=>state[it.id]).length / castle.norm.length;

  els.statPercent.textContent = pct+'%';
  els.statPop.textContent = (done*340).toLocaleString('ja-JP')+'人';
  els.statCount.textContent = completedLands+' / '+SECTIONS.length;
  els.progressInner.style.width = pct+'%';
  els.progressOuter.setAttribute('aria-valuenow', String(pct));
  els.banner.textContent = bannerText({
    done, started: startedLands, completed: completedLands,
    sections: SECTIONS.length, castleP,
  });
  els.parkStage.innerHTML = parkSVG();

  if(completedLands === SECTIONS.length){
    if(animateConfetti && prevCompleted !== SECTIONS.length) celebrateGrandOpen();
  }else{
    stopFireworks();   // チェックを外して未完成に戻したら花火も畳む
  }
  prevPct = pct;
  prevCompleted = completedLands;
}

function renderAll(animateConfetti){
  SECTIONS.forEach(updateSection);
  updateGlobals(animateConfetti);
  refreshOpenHeights();
}

/* ============ 演出 ============
   canvas-confetti / fireworks-js が読み込めていれば使い、
   オフラインなどで読み込めなければ CSS だけの紙吹雪にそのまま切り替わる。
   ライブラリの有無は「使う瞬間」に見るので、読み込みの遅延や失敗があっても壊れない。 */
const PARTY_COLORS = ['#d1495b','#e8b23d','#4a7ba6','#5b7a4a','#c15a8a'];

function reducedMotion(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* fireworks-js の UMD は window.Fireworks に名前空間を作り、
   その中の Fireworks / default がクラス本体。将来の形の違いも吸収しておく */
function resolveFireworks(){
  const g = window.Fireworks;
  if(!g) return null;
  if(typeof g === 'function') return g;
  if(typeof g.Fireworks === 'function') return g.Fireworks;
  if(typeof g.default === 'function') return g.default;
  return null;
}

/* CSS だけで動く従来の紙吹雪。ライブラリが無いときの受け皿 */
function burstConfetti(count, colors){
  if(reducedMotion()) return;
  const palette = colors && colors.length ? colors : PARTY_COLORS;
  for(let i=0;i<(count||70);i++){
    const el = document.createElement('div');
    el.className='confetti-piece';
    el.style.left = Math.random()*100+'vw';
    el.style.background = palette[Math.floor(Math.random()*palette.length)];
    el.style.animationDuration = (2.5+Math.random()*1.5)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

/* 完成したエリアの位置（画面上の割合）。紙吹雪をその区画から噴き上げる */
function landOrigin(sec){
  const fallback = {x:0.5, y:0.6};
  try{
    const box = els.parkStage.getBoundingClientRect();
    if(!box.width || !box.height) return fallback;
    const pos = (sec.id === 'E') ? CASTLE : POSITIONS[sec.id];
    if(!pos) return fallback;
    const clamp = v => Math.min(0.95, Math.max(0.05, v));
    return {
      x: clamp((box.left + box.width  * (pos[0]/640)) / window.innerWidth),
      y: clamp((box.top  + box.height * (pos[1]/400)) / window.innerHeight),
    };
  }catch(e){ return fallback; }
}

/* エリアがひとつ完成したとき */
function celebrateArea(sec){
  if(reducedMotion()) return;
  const colors = [sec.color, lighten(sec.color,0.3), sec.dark, '#e8b23d', '#fffaf0'];
  if(typeof window.confetti === 'function'){
    try{
      const origin = landOrigin(sec);
      window.confetti({
        particleCount:70, spread:70, startVelocity:38, scalar:.9,
        origin, colors, disableForReducedMotion:true,
      });
      window.confetti({
        particleCount:30, spread:100, startVelocity:26, scalar:.7, decay:.92,
        origin, colors, disableForReducedMotion:true,
      });
      return;
    }catch(e){ /* ライブラリ側で失敗したら下の代替へ */ }
  }
  burstConfetti(36, colors);
}

/* 全エリア完成のとき */
let fireworksHandle = null;
function celebrateGrandOpen(){
  if(reducedMotion()) return;
  const Ctor = resolveFireworks();
  if(Ctor && !fireworksHandle){
    try{
      const layer = document.createElement('div');
      layer.className = 'fx-fireworks';
      document.body.appendChild(layer);
      const fw = new Ctor(layer, {
        intensity:26, explosion:6, traceLength:3, flickering:40,
        friction:.97, gravity:1.4, opacity:.5,
        hue:{min:0,max:345}, sound:{enabled:false},
      });
      fw.start();
      fireworksHandle = {fw, layer};
      setTimeout(stopFireworks, 12000);
      if(typeof window.confetti === 'function'){
        try{ window.confetti({particleCount:140, spread:120, startVelocity:45, origin:{y:.65}, colors:PARTY_COLORS, disableForReducedMotion:true}); }catch(e){}
      }
      return;
    }catch(e){ stopFireworks(); /* 代替へ */ }
  }
  if(!fireworksHandle) burstConfetti(90, PARTY_COLORS);
}

function stopFireworks(){
  if(!fireworksHandle) return;
  const {fw, layer} = fireworksHandle;
  fireworksHandle = null;
  try{ fw.stop(); }catch(e){ /* すでに停止していても気にしない */ }
  layer.remove();
}

document.getElementById('resetBtn').onclick = ()=>{
  if(confirm('パークの建設記録をすべてリセットしますか？')){
    stopFireworks();
    state = {};
    saveState();
    renderAll(false);
  }
};

buildStrata();
renderAll(false);
setOpen('A', true);
loadState().then(()=>{ renderAll(false); });
</script>
</body>
